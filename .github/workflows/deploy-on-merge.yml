name: Deploy on merge to master

on:
  pull_request:
    types:
      - closed
    branches:
      - master

permissions:
  id-token: write
  contents: read
  # setup-go restores/saves the module cache via actions/cache.
  actions: write

jobs:
  deploy:
    name: Run make deploy
    # Only deploy for PRs that were actually merged into master.
    if: github.event.pull_request.merged == true
    # Pin until deploy is validated on ubuntu-26.04 (ubuntu-latest migrates Oct–Nov 2026).
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-deploy
          aws-region: ap-southeast-1

      - name: Deploy
        env:
          WEB_BOT_AUTH_PRIVATE_KEY: ${{ secrets.WEB_BOT_AUTH_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_WEBHOOK_PUBLIC_URL: ${{ secrets.TELEGRAM_WEBHOOK_PUBLIC_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ secrets.VITE_TURNSTILE_SITE_KEY }}
        run: |
          set +x
          KEY_FILE=""
          cleanup() {
            if [ -n "$KEY_FILE" ]; then
              rm -f "$KEY_FILE"
            fi
          }
          trap cleanup EXIT
          if [ -n "${WEB_BOT_AUTH_PRIVATE_KEY:-}" ]; then
            KEY_FILE="$(mktemp)"
            chmod 600 "$KEY_FILE"
            printf '%s' "$WEB_BOT_AUTH_PRIVATE_KEY" > "$KEY_FILE"
            unset WEB_BOT_AUTH_PRIVATE_KEY
            export WEB_BOT_AUTH_PRIVATE_KEY_FILE="$KEY_FILE"
          fi
          make --silent deploy
